<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Manajemen Konveksi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        /* Mencegah highlight biru saat tap di HP */
        * { -webkit-tap-highlight-color: transparent; }
        /* Animasi garis scan */
        .scan-line {
            width: 100%; height: 2px; background: #3b82f6; position: absolute;
            top: 50%; left: 0; box-shadow: 0 0 4px #3b82f6;
            animation: scan 2s infinite linear; display: none; z-index: 10;
        }
        @keyframes scan {
            0% { top: 10%; } 50% { top: 90%; } 100% { top: 10%; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-20 md:pb-0">

    <!-- Header Mobile Friendly -->
    <header class="bg-blue-800 text-white p-3 shadow-md flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-base sm:text-xl font-bold whitespace-nowrap overflow-hidden text-ellipsis flex-shrink-0 mr-2">
            <i class="fas fa-tshirt mr-1"></i> Konveksi App
        </h1>
        <select class="bg-blue-700 text-white text-xs sm:text-sm p-1.5 rounded border border-blue-600 focus:outline-none max-w-[140px] sm:max-w-none text-ellipsis">
            <option>Owner (Akses Penuh)</option>
            <option>Admin Gudang</option>
            <option>Staf Produksi</option>
        </select>
    </header>

    <div class="flex flex-col md:flex-row min-h-screen">
        <!-- Bottom Nav (Mobile) / Sidebar (Desktop) -->
        <nav class="bg-white w-full md:w-64 border-t md:border-t-0 md:border-r border-gray-200 fixed bottom-0 md:relative z-40 md:min-h-screen flex md:flex-col justify-around md:justify-start shadow-[0_-2px_10px_rgba(0,0,0,0.05)] md:shadow-none pb-safe">
            <button onclick="switchTab('dashboard')" class="nav-btn flex-1 md:w-full flex flex-col md:flex-row items-center justify-center md:justify-start p-2 md:p-4 text-blue-700 font-semibold border-t-2 md:border-t-0 md:border-l-4 border-blue-700 hover:bg-blue-50">
                <i class="fas fa-home text-xl md:mr-3 mb-1 md:mb-0"></i> 
                <span class="text-[10px] md:text-base">Dashboard</span>
            </button>
            <button onclick="switchTab('stok')" class="nav-btn flex-1 md:w-full flex flex-col md:flex-row items-center justify-center md:justify-start p-2 md:p-4 text-gray-500 border-t-2 md:border-t-0 md:border-l-4 border-transparent hover:bg-blue-50">
                <i class="fas fa-barcode text-xl md:mr-3 mb-1 md:mb-0"></i> 
                <span class="text-[10px] md:text-base">Stok & Scan</span>
            </button>
            <button onclick="switchTab('produksi')" class="nav-btn flex-1 md:w-full flex flex-col md:flex-row items-center justify-center md:justify-start p-2 md:p-4 text-gray-500 border-t-2 md:border-t-0 md:border-l-4 border-transparent hover:bg-blue-50">
                <i class="fas fa-cut text-xl md:mr-3 mb-1 md:mb-0"></i> 
                <span class="text-[10px] md:text-base">Produksi</span>
            </button>
            <button onclick="switchTab('keuangan')" class="nav-btn flex-1 md:w-full flex flex-col md:flex-row items-center justify-center md:justify-start p-2 md:p-4 text-gray-500 border-t-2 md:border-t-0 md:border-l-4 border-transparent hover:bg-blue-50">
                <i class="fas fa-wallet text-xl md:mr-3 mb-1 md:mb-0"></i> 
                <span class="text-[10px] md:text-base">Keuangan</span>
            </button>
        </nav>

        <!-- Main Content Area -->
        <main class="flex-1 p-3 sm:p-4 md:p-6 w-full max-w-full overflow-hidden">
            
            <!-- SECTION: STOK & SCAN BARCODE -->
            <section id="stok" class="tab-content hidden">
                <h2 class="text-xl sm:text-2xl font-bold mb-4">Manajemen Stok & Barcode</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                    <!-- Area Scanner -->
                    <div class="bg-white p-3 sm:p-4 rounded-lg shadow-sm border border-gray-100">
                        <h3 class="font-bold mb-3 border-b pb-2 text-sm sm:text-base"><i class="fas fa-camera text-blue-600"></i> Scan Barcode Gudang</h3>
                        
                        <!-- Container Kamera -->
                        <div class="relative w-full bg-gray-100 rounded-lg overflow-hidden mb-4 min-h-[200px] sm:min-h-[250px] flex items-center justify-center border-2 border-dashed border-gray-300">
                            <div id="reader" class="w-full h-full absolute inset-0"></div>
                            <div id="scan-line" class="scan-line"></div>
                            <p id="kamera-placeholder" class="text-gray-400 text-xs sm:text-sm z-0 relative pointer-events-none text-center px-4">
                                <i class="fas fa-qrcode text-3xl mb-2 block"></i>
                                Kamera Siap Digunakan
                            </p>
                        </div>
                        
                        <!-- Hasil Scan -->
                        <div id="scan-result-container" class="hidden bg-green-50 border border-green-200 p-2 sm:p-3 rounded mb-4">
                            <p class="text-xs text-green-800 mb-1">SKU Terdeteksi:</p>
                            <p id="scanned-sku" class="text-lg sm:text-xl font-mono font-bold text-green-900 break-all">-</p>
                        </div>
                        
                        <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-1">Jenis Transaksi</label>
                        <select id="jenis-transaksi" class="w-full p-2.5 border border-gray-300 rounded-md mb-4 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="MASUK_BAHAN">Masuk (Bahan Baku Tiba)</option>
                            <option value="KELUAR_PRODUKSI">Keluar (Pakai Produksi)</option>
                            <option value="MASUK_BARANGJADI">Masuk (Stok Barang Jadi)</option>
                            <option value="KELUAR_KIRIM">Keluar (Kirim Pembeli)</option>
                        </select>
                        
                        <div class="flex gap-2">
                            <button id="btn-start-scan" class="flex-1 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-2.5 px-2 rounded-md text-sm transition-colors">
                                <i class="fas fa-play mr-1"></i> Mulai Scan
                            </button>
                            <button id="btn-simpan-stok" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 px-2 rounded-md text-sm opacity-50 cursor-not-allowed transition-all" disabled>
                                <i class="fas fa-save mr-1"></i> Simpan
                            </button>
                        </div>
                    </div>

                    <!-- Riwayat Transaksi Terakhir -->
                    <div class="bg-white p-3 sm:p-4 rounded-lg shadow-sm border border-gray-100">
                        <h3 class="font-bold mb-3 border-b pb-2 text-sm sm:text-base">Riwayat Transaksi Terakhir</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-xs sm:text-sm text-left whitespace-nowrap">
                                <thead class="bg-gray-50 text-gray-600 border-b">
                                    <tr>
                                        <th class="py-2 px-2 font-medium">SKU</th>
                                        <th class="py-2 px-2 font-medium">Jenis</th>
                                        <th class="py-2 px-2 font-medium">Waktu</th>
                                    </tr>
                                </thead>
                                <tbody id="tabel-riwayat">
                                    <tr class="border-b">
                                        <td class="py-2.5 px-2 font-mono text-blue-600">BRG-JD-001</td>
                                        <td class="py-2.5 px-2"><span class="bg-green-100 text-green-800 text-[10px] sm:text-xs px-2 py-1 rounded font-semibold">Masuk</span></td>
                                        <td class="py-2.5 px-2 text-gray-500">10:32</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>

            <!-- SECTION: DASHBOARD, PRODUKSI, KEUANGAN (Disederhanakan untuk contoh) -->
            <section id="dashboard" class="tab-content block"><div class="p-4 bg-white rounded-lg shadow-sm text-center">Modul Dashboard Aktif</div></section>
            <section id="produksi" class="tab-content hidden"><div class="p-4 bg-white rounded-lg shadow-sm text-center">Modul Produksi Aktif</div></section>
            <section id="keuangan" class="tab-content hidden"><div class="p-4 bg-white rounded-lg shadow-sm text-center">Modul Keuangan Aktif</div></section>
        </main>
    </div>

    <!-- SCRIPT LOGIKA APLIKASI -->
    <script>
        // --- 1. Logika Navigasi Tab ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.add('hidden'); el.classList.remove('block');
            });
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById(tabId).classList.add('block');

            // Reset warna tombol navigasi (Mobile & Desktop)
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-blue-700', 'border-t-2', 'border-l-4', 'border-blue-700');
                btn.classList.add('text-gray-500', 'border-transparent');
            });

            // Highlight tombol aktif
            const activeBtn = document.querySelector(`button[onclick="switchTab('${tabId}')"]`);
            if(activeBtn) {
                activeBtn.classList.remove('text-gray-500', 'border-transparent');
                
                // Cek layar lebar atau mobile untuk posisi border
                if (window.innerWidth >= 768) {
                    activeBtn.classList.add('text-blue-700', 'border-l-4', 'border-blue-700');
                } else {
                    activeBtn.classList.add('text-blue-700', 'border-t-2', 'border-blue-700');
                }
            }

            // Hentikan kamera jika pindah menu untuk menghemat baterai HP
            if(tabId !== 'stok' && isScanning) {
                stopScanner();
            }
        }

        // --- 2. Logika Scanner Barcode (Menggunakan class murni Html5Qrcode) ---
        let html5QrCode;
        let isScanning = false;
        let lastScannedSku = "";

        const btnStartScan = document.getElementById('btn-start-scan');
        const btnSimpan = document.getElementById('btn-simpan-stok');
        const resultContainer = document.getElementById('scan-result-container');
        const scannedSkuText = document.getElementById('scanned-sku');
        const tabelRiwayat = document.getElementById('tabel-riwayat');
        const placeholder = document.getElementById('kamera-placeholder');
        const scanLine = document.getElementById('scan-line');

        // Inisialisasi object saat halaman dimuat
        document.addEventListener("DOMContentLoaded", () => {
            // Langsung target ke elemen reader (bukan via scanner class yang bawa UI jelek)
            html5QrCode = new Html5Qrcode("reader");
            // Set default tab ke stok untuk test
            switchTab('stok'); 
        });

        function startScanner() {
            // Minta akses kamera belakang secara spesifik (environment)
            const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };
            
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .then(() => {
                isScanning = true;
                placeholder.classList.add('hidden');
                scanLine.style.display = 'block'; // Tampilkan animasi garis
                
                btnStartScan.innerHTML = '<i class="fas fa-stop mr-1"></i> Hentikan Kamera';
                btnStartScan.classList.replace('bg-blue-600', 'bg-red-600');
                btnStartScan.classList.replace('hover:bg-blue-700', 'hover:bg-red-700');
                
                resultContainer.classList.add('hidden');
                btnSimpan.disabled = true;
                btnSimpan.classList.add('opacity-50', 'cursor-not-allowed');
            })
            .catch((err) => {
                alert("Gagal mengakses kamera. Pastikan Anda memberikan izin kamera pada browser.");
                console.error(err);
            });
        }

        function stopScanner() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                    placeholder.classList.remove('hidden');
                    scanLine.style.display = 'none';
                    
                    btnStartScan.innerHTML = '<i class="fas fa-play mr-1"></i> Mulai Scan';
                    btnStartScan.classList.replace('bg-red-600', 'bg-blue-600');
                    btnStartScan.classList.replace('hover:bg-red-700', 'hover:bg-blue-700');
                }).catch(err => console.error("Error stopping scanner", err));
            }
        }

        btnStartScan.addEventListener('click', () => {
            if (isScanning) {
                stopScanner();
            } else {
                startScanner();
            }
        });

        function onScanSuccess(decodedText) {
            // Bunyikan beep singkat (opsional, berfungsi di beberapa browser mobile)
            if(window.navigator && window.navigator.vibrate) navigator.vibrate(100);

            lastScannedSku = decodedText;
            scannedSkuText.innerText = lastScannedSku;
            resultContainer.classList.remove('hidden');
            
            btnSimpan.disabled = false;
            btnSimpan.classList.remove('opacity-50', 'cursor-not-allowed');
            
            // Hentikan kamera sementara agar user bisa menekan simpan
            stopScanner();
            btnStartScan.innerHTML = '<i class="fas fa-redo mr-1"></i> Scan Ulang';
        }

        // --- 3. Logika Simpan Transaksi ---
        btnSimpan.addEventListener('click', () => {
            const selectEl = document.getElementById('jenis-transaksi');
            const jenisTransaksiLengkap = selectEl.options[selectEl.selectedIndex].text;
            const jenisTransaksiKataPertama = jenisTransaksiLengkap.split(' ')[0];
            const waktu = new Date().toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
            
            let badgeClass = "bg-gray-100 text-gray-800";
            if(jenisTransaksiKataPertama === "Masuk") badgeClass = "bg-green-100 text-green-800";
            else if(jenisTransaksiKataPertama === "Keluar") badgeClass = "bg-red-100 text-red-800";

            const newRow = document.createElement('tr');
            newRow.className = "border-b bg-yellow-100 transition-colors duration-1000";
            newRow.innerHTML = `
                <td class="py-2.5 px-2 font-mono text-blue-600 break-all max-w-[120px] truncate">${lastScannedSku}</td>
                <td class="py-2.5 px-2"><span class="${badgeClass} text-[10px] sm:text-xs font-semibold px-2 py-1 rounded">${jenisTransaksiKataPertama}</span></td>
                <td class="py-2.5 px-2 text-gray-500">${waktu}</td>
            `;
            
            tabelRiwayat.prepend(newRow);
            setTimeout(() => { newRow.classList.remove('bg-yellow-100'); }, 1500);

            resultContainer.classList.add('hidden');
            btnSimpan.disabled = true;
            btnSimpan.classList.add('opacity-50', 'cursor-not-allowed');
            lastScannedSku = "";
            
            // Opsional: Otomatis mulai kamera lagi setelah simpan untuk kerja cepat
            startScanner();
        });
    </script>
</body>
</html>
